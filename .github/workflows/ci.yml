name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint icons and build
        run: pnpm build
      - name: Check every icon has a committed font codepoint
        run: |
          if [ -n "$(git status --porcelain icons/codepoints.json)" ]; then
            echo "::error::New icons got font codepoints. Run pnpm build and commit icons/codepoints.json."
            exit 1
          fi
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Check icons are not copies of other libraries
        run: pnpm audit:icons --fail-above 0.8

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @praticon-glyphs/site exec playwright install --with-deps chromium
      - name: Test the site in a browser
        run: pnpm test:e2e
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 14
