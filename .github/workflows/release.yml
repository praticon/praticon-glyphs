name: Release

# Run by hand from the Actions tab. Changesets then either opens/updates a
# "Version packages" PR (when there are pending changesets), or publishes any
# package versions that are not on npm yet (after that PR is merged).
# Switch to `push: branches: [main]` once releases should be automatic.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: Version packages
          commit-message: Version packages
        env:
          NPM_CONFIG_PROVENANCE: true
